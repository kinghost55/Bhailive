<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>King Cricket - Cloud Live Platform</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0d1117; color: #ffffff; padding: 10px; }
        
        /* Header */
        .header { display: flex; justify-content: space-between; align-items: center; background: #161b22; padding: 12px 15px; border-bottom: 2px solid #2ed573; border-radius: 6px; margin-bottom: 15px; }
        .user-info { font-size: 0.9rem; color: #ffb703; font-weight: bold; }
        .logout-btn { background: #ff4757; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        
        /* Panels */
        .panel-box { max-width: 400px; margin: 40px auto; background: #161b22; padding: 25px; border-radius: 8px; border: 1px solid #30363d; }
        .panel-box input { width: 100%; padding: 10px; margin: 8px 0; background: #0d1117; border: 1px solid #30363d; color: white; border-radius: 4px; }
        .panel-box button { width: 100%; padding: 10px; background: #2ed573; color: black; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        
        /* Match Card List View */
        .match-card { background: #161b22; border: 1px solid #2ed573; border-radius: 8px; padding: 15px; margin-bottom: 15px; cursor: pointer; transition: 0.2s; }
        .match-card:hover { background: #1f242d; }
        .match-type { font-size: 0.75rem; color: #8b949e; text-transform: uppercase; }
        .status-live { color: #ff4757; font-weight: bold; animation: blink 1.5s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
        .teams-title { font-size: 1.1rem; font-weight: bold; color: #ffffff; margin: 8px 0; }
        .click-hint { font-size: 0.8rem; color: #2ed573; text-align: right; margin-top: 5px; }

        /* Full Match Detail Page View */
        #matchDetailPage { display: none; }
        .back-btn { background: #21262d; border: 1px solid #30363d; color: white; padding: 6px 12px; border-radius: 4px; cursor: pointer; margin-bottom: 12px; font-weight: bold; }
        .score-box { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 15px; margin-bottom: 15px; text-align: center; }
        .score-title { color: #2ed573; font-size: 1.2rem; font-weight: bold; margin-bottom: 5px; }
        .score-desc { font-size: 0.95rem; color: #ffb703; }
        
        /* Odds Section */
        .section-header { font-size: 1rem; color: #ffb703; font-weight: bold; margin: 15px 0 8px 0; border-bottom: 1px solid #30363d; padding-bottom: 5px; }
        .odds-container { display: flex; gap: 10px; margin-bottom: 15px; }
        .odds-btn { flex: 1; background: #21262d; border: 1px solid #30363d; padding: 10px; border-radius: 5px; text-align: center; cursor: pointer; }
        .odds-btn:hover { border-color: #2ed573; }
        .odds-val { font-size: 1.1rem; font-weight: bold; color: #2ed573; margin-top: 3px; }

        /* Fancy Section */
        .fancy-card { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 10px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .fancy-name { font-size: 0.9rem; font-weight: bold; }
        .fancy-rates { display: flex; gap: 8px; }
        .rate-box { background: #21262d; border: 1px solid #30363d; padding: 6px 12px; border-radius: 4px; text-align: center; cursor: pointer; font-size: 0.85rem; }
        .rate-box span { display: block; font-weight: bold; color: #2ed573; }

        /* Dealer Control */
        .dealer-table { width: 100%; margin-top: 15px; border-collapse: collapse; font-size: 0.85rem; }
        .dealer-table th, .dealer-table td { border: 1px solid #30363d; padding: 8px; text-align: center; }
        .dealer-table th { background: #21262d; color: #2ed573; }
    </style>
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="panel-box">
        <h2 style="color:#2ed573; margin-bottom:15px; text-align:center;">🏏 King Cricket Login</h2>
        <input type="text" id="cUser" placeholder="Username (Client or Dealer)">
        <input type="password" id="cPass" placeholder="Password">
        <button onclick="userLogin()">Login to System</button>
    </div>

    <!-- CLIENT DASHBOARD -->
    <div id="clientDashboard" style="display: none;">
        <div class="header">
            <div>
                <h3 style="color:#2ed573;">👑 King Cricket</h3>
                <div class="user-info">Account: <span id="displayUsername"></span> | Bal: Rs. <span id="displayBalance">0</span></div>
            </div>
            <button class="logout-btn" onclick="userLogout()">Logout</button>
        </div>

        <!-- LIST VIEW -->
        <div id="matchesListView">
            <div style="font-weight: bold; color: #ffb703; margin-bottom: 10px;">🔴 Cloud Live Matches</div>
            <div id="apiMatchesContainer">
                <div style="text-align:center; padding:30px; color:#8b949e;">Fetching Live Matches...</div>
            </div>
        </div>

        <!-- DETAIL PAGE -->
        <div id="matchDetailPage">
            <button class="back-btn" onclick="backToList()">⬅ Back to Matches</button>
            <div class="score-box">
                <div class="score-title" id="detailMatchTitle">Loading...</div>
                <div class="score-desc" id="detailMatchStatus">Fetching score...</div>
            </div>
            <div class="section-header">📈 Match Rates / Winner Odds</div>
            <div class="odds-container" id="detailOddsContainer"></div>
            <div class="section-header">⚡ Live Fancies (Session / Wickets)</div>
            <div id="detailFancyContainer"></div>
        </div>
    </div>

    <!-- DEALER DASHBOARD -->
    <div id="dealerDashboard" style="display: none;">
        <div class="header">
            <div>
                <h3 style="color:#2ed573;">👑 Dealer Panel (Cloud)</h3>
                <div class="user-info">Dealer: <span id="dealerNameDisplay"></span></div>
            </div>
            <button class="logout-btn" onclick="userLogout()">Logout</button>
        </div>
        <div class="panel-box" style="max-width:100%; margin:0 0 20px 0;">
            <h3 style="color:#2ed573; margin-bottom:10px;">Create New Client Account</h3>
            <input type="text" id="newClientUser" placeholder="Client Username">
            <input type="password" id="newClientPass" placeholder="Client Password">
            <input type="number" id="newClientBal" placeholder="Initial Balance (Rs)">
            <button onclick="createClientAccount()">Create Account on Cloud</button>
        </div>
        <h3 style="color:#ffb703;">Manage Clients</h3>
        <div style="overflow-x:auto;">
            <table class="dealer-table">
                <thead>
                    <tr><th>Username</th><th>Balance</th><th>Action</th></tr>
                </thead>
                <tbody id="dealerClientsList">
                    <!-- Dynamic Cloud Clients -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // --- FIREBASE CONFIGURATION ---
        const firebaseConfig = {
            apiKey: "AIzaSyDummyKeyForCloudSync99",
            authDomain: "king-cricket-cloud.firebaseapp.com",
            projectId: "king-cricket-cloud"
        };
        // Safe initialization check
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        const API_KEY = "PwD74O2768.432";
        let currentUser = null;
        let userRole = null;
        let fetchedMatches = [];

        window.onload = function() {
            let session = JSON.parse(sessionStorage.getItem('bhai_cloud_session'));
            if(session) {
                currentUser = session.username;
                userRole = session.role;
                loadCorrectDashboard();
            }
        };

        async function userLogin() {
            let u = document.getElementById('cUser').value.trim();
            let p = document.getElementById('cPass').value.trim();

            if(u === "dealer" && p === "dealer123") {
                currentUser = "Dealer";
                userRole = "dealer";
                sessionStorage.setItem('bhai_cloud_session', JSON.stringify({username: u, role: 'dealer'}));
                loadCorrectDashboard();
                return;
            }

            // Check Firebase Cloud for Client
            try {
                let doc = await db.collection("users").doc(u).get();
                if(doc.exists && doc.data().password === p) {
                    currentUser = u;
                    userRole = "client";
                    sessionStorage.setItem('bhai_cloud_session', JSON.stringify({username: u, role: 'client'}));
                    loadCorrectDashboard();
                } else {
                    alert('Ghalat Username ya Password!');
                }
            } catch(e) {
                alert('Cloud Connection Error! Check internet.');
            }
        }

        function userLogout() {
            sessionStorage.removeItem('bhai_cloud_session');
            location.reload();
        }

        function loadCorrectDashboard() {
            document.getElementById('loginScreen').style.display = 'none';
            if(userRole === 'dealer') {
                document.getElementById('dealerDashboard').style.display = 'block';
                document.getElementById('dealerNameDisplay').innerText = currentUser;
                loadDealerClients();
            } else {
                document.getElementById('clientDashboard').style.display = 'block';
                document.getElementById('displayUsername').innerText = currentUser;
                startClientLiveFeed();
            }
        }

        // --- CLIENT FUNCTIONS ---
        function startClientLiveFeed() {
            syncClientBalance();
            fetchLiveCricketData();
            setInterval(fetchLiveCricketData, 15000);
            // Realtime balance listener from cloud
            db.collection("users").doc(currentUser).onSnapshot((doc) => {
                if(doc.exists) {
                    document.getElementById('displayBalance').innerText = doc.data().balance;
                }
            });
        }

        async function syncClientBalance() {
            let doc = await db.collection("users").doc(currentUser).get();
            if(doc.exists) {
                document.getElementById('displayBalance').innerText = doc.data().balance;
            }
        }

        async function fetchLiveCricketData() {
            let container = document.getElementById('apiMatchesContainer');
            let targetUrl = `https://api.cricketdata.org/v1/currentMatches?apikey=${API_KEY}&offset=0`;

            try {
                let response = await fetch(targetUrl);
                let result = await response.json();
                if (result && result.data && result.data.length > 0) {
                    renderMatchesList(result.data);
                } else {
                    renderFallbackMatches();
                }
            } catch (error) {
                renderFallbackMatches();
            }
        }

        function renderMatchesList(matches) {
            fetchedMatches = matches;
            let container = document.getElementById('apiMatchesContainer');
            container.innerHTML = '';

            matches.forEach((match, index) => {
                let isLive = match.matchStarted && !match.matchEnded;
                let statusText = isLive ? '🔴 LIVE NOW' : (match.matchEnded ? '🏁 FINISHED' : '📅 UPCOMING');

                container.innerHTML += `
                    <div class="match-card" onclick="openMatchDetail(${index})">
                        <div style="display:flex; justify-content:space-between;">
                            <span class="match-type">${match.matchType ? match.matchType.toUpperCase() : 'T20 MATCH'}</span>
                            <span class="${isLive ? 'status-live' : ''}">${statusText}</span>
                        </div>
                        <div class="teams-title">${match.name}</div>
                        <div style="font-size:0.85rem; color:#ffb703;">${match.status || 'Tap to see live details'}</div>
                        <div class="click-hint">Click to Open Match Page ➔</div>
                    </div>
                `;
            });
        }

        function renderFallbackMatches() {
            renderMatchesList([
                { name: "Pakistan vs Australia", matchType: "T20", status: "PAK: 142/3 (15.2 Overs) - LIVE NOW", matchStarted: true, matchEnded: false, teams: ["Pakistan", "Australia"] },
                { name: "India vs England", matchType: "ODI", status: "Starts today at 7:00 PM", matchStarted: false, matchEnded: false, teams: ["India", "England"] }
            ]);
        }

        function openMatchDetail(index) {
            let match = fetchedMatches[index];
            if(!match) return;

            document.getElementById('matchesListView').style.display = 'none';
            document.getElementById('matchDetailPage').style.display = 'block';

            document.getElementById('detailMatchTitle').innerText = match.name;
            document.getElementById('detailMatchStatus').innerText = match.status || 'Match in progress';

            let team1 = (match.teams && match.teams[0]) ? match.teams[0] : "Team A";
            let team2 = (match.teams && match.teams[1]) ? match.teams[1] : "Team B";

            document.getElementById('detailOddsContainer').innerHTML = `
                <div class="odds-btn" onclick="placeBet('${team1} (Winner)', 1.90)">
                    <div style="font-size:0.85rem; color:#8b949e;">${team1}</div>
                    <div class="odds-val">1.90</div>
                </div>
                <div class="odds-btn" onclick="placeBet('${team2} (Winner)', 1.90)">
                    <div style="font-size:0.85rem; color:#8b949e;">${team2}</div>
                    <div class="odds-val">1.90</div>
                </div>
            `;

            document.getElementById('detailFancyContainer').innerHTML = `
                <div class="fancy-card">
                    <div class="fancy-name">10 Over Runs Session</div>
                    <div class="fancy-rates">
                        <div class="rate-box" onclick="placeBet('10 Over Fancy - NOT', 1.85)">NOT<span>78</span></div>
                        <div class="rate-box" onclick="placeBet('10 Over Fancy - YES', 1.85)">YES<span>82</span></div>
                    </div>
                </div>
                <div class="fancy-card">
                    <div class="fancy-name">Fall of 1st Wicket</div>
                    <div class="fancy-rates">
                        <div class="rate-box" onclick="placeBet('1st Wicket - NOT', 1.85)">NOT<span>24</span></div>
                        <div class="rate-box" onclick="placeBet('1st Wicket - YES', 1.85)">YES<span>26</span></div>
                    </div>
                </div>
            `;
        }

        function backToList() {
            document.getElementById('matchDetailPage').style.display = 'none';
            document.getElementById('matchesListView').style.display = 'block';
        }

        async function placeBet(targetName, odds) {
            let amount = prompt(`Enter bet amount for ${targetName} (Rate: ${odds}):`);
            if(!amount || isNaN(amount) || amount <= 0) return;
            amount = parseFloat(amount);

            let userRef = db.collection("users").doc(currentUser);
            let doc = await userRef.get();
            let currentBal = doc.data().balance;

            if(currentBal < amount) {
                alert('Balance kam hai!');
                return;
            }

            let newBal = currentBal - amount;
            await userRef.update({ balance: newBal });
            alert(`Bet placed successfully for Rs. ${amount}!`);
        }

        // --- DEALER FUNCTIONS ---
        async function createClientAccount() {
            let u = document.getElementById('newClientUser').value.trim();
            let p = document.getElementById('newClientPass').value.trim();
            let b = parseFloat(document.getElementById('newClientBal').value) || 0;

            if(!u || !p) {
                alert('Username aur Password lazmi hain!');
                return;
            }

            await db.collection("users").doc(u).set({
                username: u,
                password: p,
                balance: b
            });

            alert(`Client ${u} created successfully on Cloud!`);
            document.getElementById('newClientUser').value = '';
            document.getElementById('newClientPass').value = '';
            document.getElementById('newClientBal').value = '';
            loadDealerClients();
        }

        async function loadDealerClients() {
            let tbody = document.getElementById('dealerClientsList');
            tbody.innerHTML = `<tr><td colspan="3">Loading from Cloud...</td></tr>`;

            let snapshot = await db.collection("users").get();
            tbody.innerHTML = '';
            
            snapshot.forEach(doc => {
                let data = doc.data();
                tbody.innerHTML += `
                    <tr>
                        <td>${data.username}</td>
                        <td>Rs. ${data.balance}</td>
                        <td>
                            <button onclick="modifyBalance('${data.username}', 1000)" style="background:#2ed573; border:none; padding:4px 8px; cursor:pointer;">+1000</button>
                            <button onclick="modifyBalance('${data.username}', -1000)" style="background:#ff4757; color:white; border:none; padding:4px 8px; cursor:pointer;">-1000</button>
                        </td>
                    </tr>
                `;
            });
        }

        async function modifyBalance(username, amount) {
            let ref = db.collection("users").doc(username);
            let doc = await ref.get();
            if(doc.exists) {
                let newBal = doc.data().balance + amount;
                await ref.update({ balance: newBal });
                loadDealerClients();
            }
        }
    </script>
</body>
</html>
