<!html html>
<html lang="ur" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>King Cricket - Live Platform</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: #0b0e14; color: #ffffff; padding: 10px; }
        
        /* Header */
        .header { display: flex; justify-content: space-between; align-items: center; background: #161b22; padding: 12px 15px; border-bottom: 2px solid #2ed573; border-radius: 6px; margin-bottom: 15px; }
        .logo-title { color: #2ed573; font-size: 1.1rem; font-weight: bold; }
        .user-info { font-size: 0.85rem; color: #ffb703; margin-top: 2px; }
        .logout-btn { background: #ff4757; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 0.85rem; }
        
        /* Login & Panels */
        .panel-box { max-width: 380px; margin: 50px auto; background: #161b22; padding: 25px; border-radius: 8px; border: 1px solid #30363d; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .panel-box h2 { color: #2ed573; margin-bottom: 15px; text-align: center; font-size: 1.3rem; }
        .panel-box input { width: 100%; padding: 10px; margin: 8px 0; background: #0d1117; border: 1px solid #30363d; color: white; border-radius: 4px; font-size: 0.95rem; }
        .panel-box button { width: 100%; padding: 11px; background: #2ed573; color: #000; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 12px; font-size: 1rem; }

        /* Match Card List View */
        .match-card { background: #161b22; border: 1px solid #30363d; border-left: 4px solid #2ed573; border-radius: 8px; padding: 14px; margin-bottom: 12px; cursor: pointer; transition: 0.2s; }
        .match-card:hover { background: #1c2128; border-color: #2ed573; }
        .match-type { font-size: 0.75rem; color: #8b949e; text-transform: uppercase; font-weight: bold; }
        .status-live { color: #ff4757; font-weight: bold; animation: blink 1.2s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
        .teams-title { font-size: 1.05rem; font-weight: bold; color: #ffffff; margin: 6px 0; }
        .match-substatus { font-size: 0.85rem; color: #ffb703; }
        .click-hint { font-size: 0.75rem; color: #2ed573; text-align: right; margin-top: 4px; font-weight: bold; }

        /* Full Match Detail Page View */
        #matchDetailPage { display: none; }
        .back-btn { background: #21262d; border: 1px solid #30363d; color: white; padding: 6px 14px; border-radius: 4px; cursor: pointer; margin-bottom: 12px; font-weight: bold; font-size: 0.9rem; }
        
        .score-box { background: linear-gradient(135deg, #161b22 0%, #1f242d 100%); border: 1px solid #30363d; border-radius: 8px; padding: 15px; margin-bottom: 15px; text-align: center; }
        .score-title { color: #2ed573; font-size: 1.15rem; font-weight: bold; margin-bottom: 4px; }
        .score-desc { font-size: 0.9rem; color: #ffb703; font-weight: bold; }
        
        /* Odds Section */
        .section-header { font-size: 0.95rem; color: #ffb703; font-weight: bold; margin: 15px 0 8px 0; border-bottom: 1px solid #30363d; padding-bottom: 4px; display: flex; justify-content: space-between; }
        .odds-container { display: flex; gap: 10px; margin-bottom: 12px; }
        .odds-btn { flex: 1; background: #161b22; border: 1px solid #30363d; padding: 10px; border-radius: 6px; text-align: center; cursor: pointer; }
        .odds-btn:hover { border-color: #2ed573; }
        .odds-val { font-size: 1.1rem; font-weight: bold; color: #2ed573; margin-top: 2px; }

        /* Fancy Section */
        .fancy-card { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 10px 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .fancy-name { font-size: 0.9rem; font-weight: bold; color: #e6edf3; }
        .fancy-rates { display: flex; gap: 6px; }
        .rate-box { background: #21262d; border: 1px solid #30363d; padding: 6px 12px; border-radius: 4px; text-align: center; cursor: pointer; font-size: 0.8rem; min-width: 60px; }
        .rate-box span { display: block; font-weight: bold; color: #2ed573; font-size: 0.9rem; }

        /* Dealer Tables */
        .dealer-table { width: 100%; margin-top: 10px; border-collapse: collapse; font-size: 0.85rem; background: #161b22; border-radius: 6px; overflow: hidden; }
        .dealer-table th, .dealer-table td { border: 1px solid #30363d; padding: 8px; text-align: center; }
        .dealer-table th { background: #21262d; color: #2ed573; }
    </style>
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="panel-box">
        <h2>🏏 King Cricket</h2>
        <input type="text" id="cUser" placeholder="Username (Client/Dealer)">
        <input type="password" id="cPass" placeholder="Password">
        <button onclick="userLogin()">Login</button>
    </div>

    <!-- CLIENT DASHBOARD -->
    <div id="clientDashboard" style="display: none;">
        <div class="header">
            <div>
                <div class="logo-title">👑 King Cricket</div>
                <div class="user-info">ID: <span id="displayUsername"></span> | Bal: Rs. <span id="displayBalance">0</span></div>
            </div>
            <button class="logout-btn" onclick="userLogout()">Logout</button>
        </div>

        <!-- LIST VIEW -->
        <div id="matchesListView">
            <div style="font-weight: bold; color: #ffb703; margin-bottom: 10px; font-size: 0.95rem;">🔴 Live Matches (Classbet Feed)</div>
            <div id="apiMatchesContainer"></div>
        </div>

        <!-- DETAIL PAGE -->
        <div id="matchDetailPage">
            <button class="back-btn" onclick="backToList()">⬅ Back to Matches</button>
            
            <div class="score-box">
                <div class="score-title" id="detailMatchTitle">Loading...</div>
                <div class="score-desc" id="detailMatchStatus">Fetching score...</div>
            </div>

            <div class="section-header"><span>📈 Match Winner Odds</span><span style="color:#8b949e; font-size:0.8rem;">Back / Lay</span></div>
            <div class="odds-container" id="detailOddsContainer"></div>

            <div class="section-header"><span>⚡ Live Fancies (Session & Wickets)</span><span style="color:#8b949e; font-size:0.8rem;">Not / Yes</span></div>
            <div id="detailFancyContainer"></div>
        </div>
    </div>

    <!-- DEALER DASHBOARD -->
    <div id="dealerDashboard" style="display: none;">
        <div class="header">
            <div>
                <div class="logo-title">👑 Dealer Control Panel</div>
                <div class="user-info">Dealer: <span id="dealerNameDisplay"></span></div>
            </div>
            <button class="logout-btn" onclick="userLogout()">Logout</button>
        </div>
        <div class="panel-box" style="max-width:100%; margin:0 0 15px 0;">
            <h3 style="color:#2ed573; margin-bottom:10px; font-size:1.1rem;">Create Client Account</h3>
            <input type="text" id="newClientUser" placeholder="Client Username">
            <input type="password" id="newClientPass" placeholder="Client Password">
            <input type="number" id="newClientBal" placeholder="Initial Balance (Rs)">
            <button onclick="createClientAccount()">Create Account</button>
        </div>
        <div style="font-weight:bold; color:#ffb703; margin-bottom:5px;">Manage Clients & Balance</div>
        <div style="overflow-x:auto;">
            <table class="dealer-table">
                <thead>
                    <tr><th>Username</th><th>Password</th><th>Balance</th><th>Quick Actions</th></tr>
                </thead>
                <tbody id="dealerClientsList"></tbody>
            </table>
        </div>
    </div>

    <script>
        let currentUser = null;
        let userRole = null;
        let activeMatches = [
            { id: 1, name: "Pakistan vs Australia", type: "T20 International", status: "PAK: 154/3 (16.4 Overs) - LIVE", team1: "Pakistan", team2: "Australia" },
            { id: 2, name: "India vs England", type: "ODI Series", status: "IND: 220/4 (35.1 Overs) - LIVE", team1: "India", team2: "England" },
            { id: 3, name: "South Africa vs New Zealand", type: "Test Match", status: "Day 2: Stumps - NZ lead by 45 runs", team1: "South Africa", team2: "New Zealand" }
        ];

        window.onload = function() {
            let session = JSON.parse(localStorage.getItem('king_session') || 'null');
            if(session) {
                currentUser = session.username;
                userRole = session.role;
                loadDashboard();
            }
        };

        function userLogin() {
            let u = document.getElementById('cUser').value.trim();
            let p = document.getElementById('cPass').value.trim();

            if(u === "dealer" && p === "dealer123") {
                currentUser = "Dealer";
                userRole = "dealer";
                localStorage.setItem('king_session', JSON.stringify({username: u, role: 'dealer'}));
                loadDashboard();
                return;
            }

            let users = JSON.parse(localStorage.getItem('king_users') || '[]');
            let found = users.find(x => x.username === u && x.password === p);

            if(found) {
                currentUser = u;
                userRole = "client";
                localStorage.setItem('king_session', JSON.stringify({username: u, role: 'client'}));
                loadDashboard();
            } else {
                alert('Ghalat Username ya Password!');
            }
        }

        function userLogout() {
            localStorage.removeItem('king_session');
            location.reload();
        }

        function loadDashboard() {
            document.getElementById('loginScreen').style.display = 'none';
            if(userRole === 'dealer') {
                document.getElementById('dealerDashboard').style.display = 'block';
                document.getElementById('dealerNameDisplay').innerText = currentUser;
                loadClientsTable();
            } else {
                document.getElementById('clientDashboard').style.display = 'block';
                document.getElementById('displayUsername').innerText = currentUser;
                updateClientBalanceDisplay();
                renderMatches();
            }
        }

        function updateClientBalanceDisplay() {
            let users = JSON.parse(localStorage.getItem('king_users') || '[]');
            let me = users.find(x => x.username === currentUser);
            if(me) {
                document.getElementById('displayBalance').innerText = me.balance;
            }
        }

        function renderMatches() {
            let container = document.getElementById('apiMatchesContainer');
            container.innerHTML = '';

            activeMatches.forEach((match, index) => {
                container.innerHTML += `
                    <div class="match-card" onclick="openMatch(${index})">
                        <div style="display:flex; justify-content:space-between;">
                            <span class="match-type">${match.type}</span>
                            <span class="status-live">🔴 LIVE</span>
                        </div>
                        <div class="teams-title">${match.name}</div>
                        <div class="match-substatus">${match.status}</div>
                        <div class="click-hint">Open Match & Fancies ➔</div>
                    </div>
                `;
            });
        }

        function openMatch(index) {
            let match = activeMatches[index];
            if(!match) return;

            document.getElementById('matchesListView').style.display = 'none';
            document.getElementById('matchDetailPage').style.display = 'block';

            document.getElementById('detailMatchTitle').innerText = match.name;
            document.getElementById('detailMatchStatus').innerText = match.status;

            document.getElementById('detailOddsContainer').innerHTML = `
                <div class="odds-btn" onclick="placeBet('${match.team1} Win', 1.90)">
                    <div style="font-size:0.8rem; color:#8b949e;">${match.team1}</div>
                    <div class="odds-val">1.90</div>
                </div>
                <div class="odds-btn" onclick="placeBet('${match.team2} Win', 1.90)">
                    <div style="font-size:0.8rem; color:#8b949e;">${match.team2}</div>
                    <div class="odds-val">1.90</div>
                </div>
            `;

            document.getElementById('detailFancyContainer').innerHTML = `
                <div class="fancy-card">
                    <div class="fancy-name">10 Over Runs Session</div>
                    <div class="fancy-rates">
                        <div class="rate-box" onclick="placeBet('10 Over Runs - NOT', 1.85)">NOT<span>78</span></div>
                        <div class="rate-box" onclick="placeBet('10 Over Runs - YES', 1.85)">YES<span>82</span></div>
                    </div>
                </div>
                <div class="fancy-card">
                    <div class="fancy-name">Fall of 1st Wicket</div>
                    <div class="fancy-rates">
                        <div class="rate-box" onclick="placeBet('1st Wicket - NOT', 1.85)">NOT<span>24</span></div>
                        <div class="rate-box" onclick="placeBet('1st Wicket - YES', 1.85)">YES<span>26</span></div>
                    </div>
                </div>
            `;
        }

        function backToList() {
            document.getElementById('matchDetailPage').style.display = 'none';
            document.getElementById('matchesListView').style.display = 'block';
        }

        function placeBet(betName, odds) {
            let amount = prompt(`Enter amount for ${betName} (Rate: ${odds}):`);
            if(!amount || isNaN(amount) || amount <= 0) return;
            amount = parseFloat(amount);

            let users = JSON.parse(localStorage.getItem('king_users') || '[]');
            let idx = users.findIndex(x => x.username === currentUser);

            if(idx !== -1) {
                if(users[idx].balance < amount) {
                    alert('Balance kam hai!');
                    return;
                }
                users[idx].balance -= amount;
                localStorage.setItem('king_users', JSON.stringify(users));
                updateClientBalanceDisplay();
                alert(`Bet placed successfully for Rs. ${amount}!`);
            }
        }

        function createClientAccount() {
            let u = document.getElementById('newClientUser').value.trim();
            let p = document.getElementById('newClientPass').value.trim();
            let b = parseFloat(document.getElementById('newClientBal').value) || 0;

            if(!u || !p) {
                alert('Username aur Password lazmi hain!');
                return;
            }

            let users = JSON.parse(localStorage.getItem('king_users') || '[]');
            if(users.some(x => x.username === u)) {
                alert('Yeh username pehle seमौजूद hai!');
                return;
            }

            users.push({ username: u, password: p, balance: b });
            localStorage.setItem('king_users', JSON.stringify(users));

            alert(`Client ${u} successfully ban gaya hai!`);
            document.getElementById('newClientUser').value = '';
            document.getElementById('newClientPass').value = '';
            document.getElementById('newClientBal').value = '';
            loadClientsTable();
        }

        function loadClientsTable() {
            let tbody = document.getElementById('dealerClientsList');
            let users = JSON.parse(localStorage.getItem('king_users') || '[]');
            tbody.innerHTML = '';

            if(users.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4">Koi client mojood nahi hai.</td></tr>`;
                return;
            }

            users.forEach((user, idx) => {
                tbody.innerHTML += `
                    <tr>
                        <td><b>${user.username}</b></td>
                        <td>${user.password}</td>
                        <td style="color:#2ed573; font-weight:bold;">Rs. ${user.balance}</td>
                        <td>
                            <button onclick="changeBal(${idx}, 1000)" style="background:#2ed573; border:none; padding:4px 8px; cursor:pointer; font-weight:bold; border-radius:3px;">+1000</button>
                            <button onclick="changeBal(${idx}, -1000)" style="background:#ff4757; color:white; border:none; padding:4px 8px; cursor:pointer; font-weight:bold; border-radius:3px; margin-left:4px;">-1000</button>
                        </td>
                    </tr>
                `;
            });
        }

        function changeBal(idx, amount) {
            let users = JSON.parse(localStorage.getItem('king_users') || '[]');
            if(users[idx]) {
                users[idx].balance += amount;
                localStorage.setItem('king_users', JSON.stringify(users));
                loadClientsTable();
            }
        }
    </script>
</body>
</html>
