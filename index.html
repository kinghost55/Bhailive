<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bhai Live - Cricket</title>
    <style>
        body {
            background-color: #121826;
            color: #ffffff;
            font-family: Arial, sans-serif;
            padding: 20px;
            text-align: center;
        }
        .match-card {
            background: #1a2332;
            border: 1px solid #2a364f;
            padding: 15px;
            margin: 10px auto;
            border-radius: 8px;
            max-width: 400px;
        }
        .live-badge {
            background: #ff4757;
            color: white;
            padding: 3px 8px;
            font-size: 0.8rem;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <h2>BHAI LIVE (بھائی لائیو)</h2>
    <div id="matchesContainer">
        <p style="color: #8a99ad;">Checking live matches...</p>
    </div>

    <script>
        async function getMatches() {
            try {
                let res = await fetch('https://api.cricapi.com/v1/currentMatches?apikey=PwD74O2768.432&offset=0');
                let data = await res.json();
                
                let container = document.getElementById('matchesContainer');
                
                if (data && data.data && data.data.length > 0) {
                    let html = '';
                    for (let i = 0; i < data.data.length; i++) {
                        let m = data.data[i];
                        html += '<div class="match-card">';
                        html += '<span class="live-badge">LIVE</span>';
                        html += '<h3>' + m.name + '</h3>';
                        html += '<p>' + m.status + '</p>';
                        html += '</div>';
                    }
                    container.innerHTML = html;
                } else {
                    container.innerHTML = '<h3 style="color: #ffb703; margin-top: 30px;">No Match Live</h3><p style="color: #8a99ad;">Is waqt koi match live nahi hai.</p>';
                }
            } catch (err) {
                document.getElementById('matchesContainer').innerHTML = '<h3 style="color: #ffb703; margin-top: 30px;">No Match Live</h3>';
            }
        }
        
        getMatches();
    </script>
</body>
</html>
