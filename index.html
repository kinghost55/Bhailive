<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bhailive - Live Cricket</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #0d1117; color: #ffffff; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 480px; background-color: #161b22; min-height: 100vh; padding: 20px; }
        .title { color: #00e676; font-size: 24px; text-align: center; margin-bottom: 20px; font-weight: bold; }
        .card { background-color: #21262d; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #30363d; }
        .badge { background-color: #da3633; color: white; font-size: 10px; padding: 3px 6px; border-radius: 4px; font-weight: bold; display: inline-block; margin-bottom: 8px; }
        .teams { font-size: 16px; font-weight: bold; margin-bottom: 5px; }
        .score { color: #00e676; font-size: 14px; margin-bottom: 10px; }
        .odds { display: flex; gap: 10px; }
        .btn { flex: 1; padding: 8px; text-align: center; border-radius: 5px; font-weight: bold; font-size: 13px; }
        .pak { background-color: #1f6beb; color: white; }
        .aus { background-color: #d73a49; color: white; }
    </style>
</head>
<body>

<div class="container">
    <div class="title">Bhailive Cricket</div>

    <div class="card">
        <span class="badge">IN-PLAY</span>
        <div class="teams">Pakistan vs Australia</div>
        <div class="score">PAK: 210/3 (14.3 Overs)</div>
        <div class="odds">
            <div class="btn pak">PAK: 1.85</div>
            <div class="btn aus">AUS: 2.10</div>
        </div>
    </div>
</div>

</body>
</html>
