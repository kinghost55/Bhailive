<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>King Cricket - Bhai Live</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0d1117; color: #ffffff; padding: 10px; }
        .header { display: flex; justify-content: space-between; align-items: center; background: #161b22; padding: 12px 15px; border-bottom: 2px solid #2ed573; border-radius: 6px; }
        .user-info { font-size: 0.9rem; color: #ffb703; }
        .logout-btn { background: #ff4757; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        
        .login-box { max-width: 350px; margin: 60px auto; background: #161b22; padding: 25px; border-radius: 8px; border: 1px solid #30363d; text-align: center; }
        .login-box input { width: 100%; padding: 10px; margin: 8px 0; background: #0d1117; border: 1px solid #30363d; color: white; border-radius: 4px; }
        .login-box button { width: 100%; padding: 10px; background: #2ed573; color: black; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        
        .tab-menu { display: flex; gap: 10px; margin: 15px 0; border-bottom: 1px solid #30363d; padding-bottom: 5px; }
        .tab-btn { background: #161b22; border: 1px solid #30363d; color: white; padding: 8px 16px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .tab-btn.active { background: #2ed573; color: black; border-color: #2ed573; }
        
        .match-card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 15px; margin-bottom: 12px; }
        .match-header { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 10px; }
        .status-live { color: #ff4757; font-weight: bold; animation: blink 1.5s infinite; }
        .status-upcoming { color: #ffb703; font-weight: bold; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
        
        .teams { font-size: 1.1rem; font-weight: bold; margin-bottom: 10px; color: #2ed573; }
        .odds-container { display: flex; gap: 10px; }
        .odds-btn { flex: 1; background: #21262d; border: 1px solid #30363d; padding: 8px; border-radius: 5px; text-align: center; cursor: pointer; }
        .odds-btn:hover { border-color: #2ed573; }
        .odds-val { font-size: 1rem; font-weight: bold; color: #2ed573; }
    </style>
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="login-box">
        <h2 style="color:#2ed573; margin-bottom:15px;">🏏 King Cricket Login</h2>
        <input type="text" id="cUser" placeholder="Client Username">
        <input type="password" id="cPass" placeholder="Password">
        <button onclick="clientLogin()">Login to Play</button>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="mainDashboard" style="display: none;">
        <div class="header">
            <div>
                <h3 style="color:#2ed573;">👑 King Cricket</h3>
                <div class="user-info">User: <span id="displayUsername"></span> | Bal: Rs. <span id="displayBalance">0</span></div>
            </div>
            <!-- LOGOUT BUTTON -->
            <button class="logout-btn" onclick="clientLogout()">Logout</button>
        </div>

        <div class="tab-menu">
            <button class="tab-btn active" onclick="showMatches('live')">🔴 Live Matches</button>
            <button class="tab-btn" onclick="showMatches('upcoming')">📅 Upcoming Matches</button>
        </div>

        <div id="matchesContainer">
            <!-- Dynamic Matches Loaded Here -->
        </div>
    </div>

    <script>
        let currentClient = null;

        // Sample Matches Data with correct statuses
        const matchesData = [
            { id: 1, teamA: "Pakistan", teamB: "India", type: "live", statusText: "LIVE 15.4 Overs", oddsA: "1.85", oddsB: "2.10" },
            { id: 2, teamA: "Australia", teamB: "England", type: "live", statusText: "LIVE Inning Break", oddsA: "1.90", oddsB: "1.90" },
            { id: 3, teamA: "South Africa", teamB: "New Zealand", type: "upcoming", statusText: "Starts Today 7:00 PM", oddsA: "1.75", oddsB: "2.20" }
        ];

        // CHECK IF ALREADY LOGGED IN
        window.onload = function() {
            let session = JSON.parse(sessionStorage.getItem('bhai_active_client'));
            if(session) {
                currentClient = session;
                loadDashboard();
            }
        };

        function clientLogin() {
            let u = document.getElementById('cUser').value.trim();
            let p = document.getElementById('cPass').value.trim();

            let users = JSON.parse(localStorage.getItem('bhai_users') || '[]');
            let found = users.find(x => x.username === u && x.password === p);

            if(found) {
                currentClient = found;
                sessionStorage.setItem('bhai_active_client', JSON.stringify(found));
                loadDashboard();
            } else {
                alert('Ghalat Username ya Password!');
            }
        }

        function clientLogout() {
            sessionStorage.removeItem('bhai_active_client');
            currentClient = null;
            document.getElementById('mainDashboard').style.display = 'none';
            document.getElementById('loginScreen').style.display = 'block';
            document.getElementById('cUser').value = '';
            document.getElementById('cPass').value = '';
        }

        function loadDashboard() {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('mainDashboard').style.display = 'block';
            document.getElementById('displayUsername').innerText = currentClient.username;
            
            // Sync Fresh Balance from localStorage
            let users = JSON.parse(localStorage.getItem('bhai_users') || '[]');
            let fresh = users.find(x => x.username === currentClient.username);
            if(fresh) {
                document.getElementById('displayBalance').innerText = fresh.balance;
            }

            showMatches('live');
        }

        function showMatches(filterType) {
            let tabs = document.querySelectorAll('.tab-btn');
            tabs.forEach(t => t.classList.remove('active'));
            
            if(filterType === 'live') tabs[0].classList.add('active');
            else tabs[1].classList.add('active');

            let container = document.getElementById('matchesContainer');
            container.innerHTML = '';

            let filtered = matchesData.filter(m => m.type === filterType);

            if(filtered.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding:30px; color:#8b949e;">No matches available right now.</div>`;
                return;
            }

            filtered.forEach(m => {
                let badgeClass = m.type === 'live' ? 'status-live' : 'status-upcoming';
                container.innerHTML += `
                    <div class="match-card">
                        <div class="match-header">
                            <span>T20 World Match</span>
                            <span class="${badgeClass}">${m.statusText}</span>
                        </div>
                        <div class="teams">${m.teamA} vs ${m.teamB}</div>
                        <div class="odds-container">
                            <div class="odds-btn" onclick="placeBet('${m.teamA}', ${m.oddsA})">
                                <div style="font-size:0.8rem; color:#8b949e;">${m.teamA}</div>
                                <div class="odds-val">${m.oddsA}</div>
                            </div>
                            <div class="odds-btn" onclick="placeBet('${m.teamB}', ${m.oddsB})">
                                <div style="font-size:0.8rem; color:#8b949e;">${m.teamB}</div>
                                <div class="odds-val">${m.oddsB}</div>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function placeBet(teamName, odds) {
            let amount = prompt(`Enter bet amount for ${teamName} (Odds: ${odds}):`);
            if(!amount || isNaN(amount) || amount <= 0) return;
            amount = parseFloat(amount);

            let users = JSON.parse(localStorage.getItem('bhai_users') || '[]');
            let uIdx = users.findIndex(x => x.username === currentClient.username);

            if(uIdx !== -1) {
                if(users[uIdx].balance < amount) {
                    alert('Balance kam hai!');
                    return;
                }

                users[uIdx].balance -= amount;
                localStorage.setItem('bhai_users', JSON.stringify(users));
                document.getElementById('displayBalance').innerText = users[uIdx].balance;

                // Save Bet History for Dealer to see
                let bets = JSON.parse(localStorage.getItem('bhai_bets') || '[]');
                bets.push({
                    username: currentClient.username,
                    match: `${teamName} (Odds: ${odds})`,
                    amount: amount,
                    status: 'Active',
                    date: new Date().toLocaleString()
                });
                localStorage.setItem('bhai_bets', JSON.stringify(bets));

                alert(`Bet of Rs. ${amount} placed on ${teamName}!`);
            }
        }
    </script>
</body>
</html>
