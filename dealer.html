<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dealer Panel - Bhai Live</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0f141f; color: #ffffff; padding: 15px; }
        .login-wrapper { display: flex; justify-content: center; align-items: center; height: 80vh; }
        .login-card { background: #1a2332; border: 1px solid #2ed573; border-radius: 10px; padding: 30px; width: 100%; max-width: 400px; text-align: center; }
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 0.9rem; color: #a0aec0; }
        .form-group input { width: 100%; padding: 10px; background: #243044; border: 1px solid #2a364f; color: white; border-radius: 5px; }
        .btn { background: #2ed573; color: black; border: none; padding: 10px; border-radius: 5px; font-weight: bold; cursor: pointer; width: 100%; }
        #dealerDashboard { display: none; max-width: 750px; margin: 0 auto; }
        .dealer-header { display: flex; justify-content: space-between; align-items: center; background: #1a2332; padding: 15px; border-radius: 8px; border-bottom: 2px solid #2ed573; margin-bottom: 20px; }
        .card { background: #1a2332; border: 1px solid #2a364f; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
        .card-title { color: #2ed573; font-size: 1.1rem; margin-bottom: 15px; border-bottom: 1px solid #2a364f; padding-bottom: 5px; }
        .data-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        .data-table th, .data-table td { border: 1px solid #2a364f; padding: 8px; text-align: left; }
        .data-table th { background: #243044; color: #2ed573; }
    </style>
</head>
<body>

    <!-- Dealer Login Screen -->
    <div class="login-wrapper" id="dealerLoginScreen">
        <div class="login-card">
            <h2 style="color:#2ed573; margin-bottom:15px;">💼 Dealer Login</h2>
            <div class="form-group">
                <label>Dealer Username</label>
                <input type="text" id="dUser" placeholder="Enter Dealer Username">
            </div>
            <div class="form-group">
                <label>Dealer Password</label>
                <input type="password" id="dPass" placeholder="Enter Password">
            </div>
            <button class="btn" onclick="dealerLogin()">Login</button>
        </div>
    </div>

    <!-- Dealer Dashboard -->
    <div id="dealerDashboard">
        <div class="dealer-header">
            <div>
                <h3 id="currentDealerName" style="color:#2ed573;">Dealer Panel</h3>
                <span id="currentDealerBalance" style="font-size:0.85rem; color:#ffb703;">Balance: Rs. 0</span>
            </div>
            <button style="background:#ff4757; color:white; border:none; padding:6px 12px; border-radius:4px; cursor:pointer;" onclick="location.reload()">Logout</button>
        </div>

        <!-- Create User Card -->
        <div class="card">
            <div class="card-title">👤 Create Client Account</div>
            <div class="form-group">
                <label>Client Username</label>
                <input type="text" id="uName" placeholder="Enter client username">
            </div>
            <div class="form-group">
                <label>Client Password</label>
                <input type="password" id="uPass" placeholder="Enter password">
            </div>
            <div class="form-group">
                <label>Assign Balance</label>
                <input type="number" id="uBal" placeholder="0.00">
            </div>
            <button class="btn" onclick="createUser()">Create Client</button>
        </div>

        <!-- Active Users List -->
        <div class="card">
            <div class="card-title">📋 Active Clients List</div>
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Username</th>
                        <th>Password</th>
                        <th>Balance</th>
                    </tr>
                </thead>
                <tbody id="userTableBody">
                    <!-- Users list will appear here -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let loggedDealer = null;

        function dealerLogin() {
            let u = document.getElementById('dUser').value.trim();
            let p = document.getElementById('dPass').value.trim();

            let dealers = JSON.parse(localStorage.getItem('bhai_dealers') || '[]');
            console.log("Available Dealers:", dealers); // Debugging ke liye

            let found = dealers.find(d => d.username === u && d.password === p);

            if (found) {
                loggedDealer = found;
                document.getElementById('dealerLoginScreen').style.display = 'none';
                document.getElementById('dealerDashboard').style.display = 'block';
                document.getElementById('currentDealerName').innerText = `💼 ${found.username}`;
                document.getElementById('currentDealerBalance').innerText = `Credit Balance: Rs. ${found.balance}`;
                renderUsers();
            } else {
                alert('Ghalat Dealer Details! Pehle Admin panel se dealer banayein.');
            }
        }

        function createUser() {
            let u = document.getElementById('uName').value.trim();
            let p = document.getElementById('uPass').value.trim();
            let b = parseFloat(document.getElementById('uBal').value) || 0;

            if(!u || !p) {
                alert('Please fill all fields!');
                return;
            }

            if(b > loggedDealer.balance) {
                alert('Aapke paas itna credit balance nahi hai!');
                return;
            }

            loggedDealer.balance -= b;
            let dealers = JSON.parse(localStorage.getItem('bhai_dealers') || '[]');
            let idx = dealers.findIndex(d => d.username === loggedDealer.username);
            if(idx !== -1) dealers[idx].balance = loggedDealer.balance;
            localStorage.setItem('bhai_dealers', JSON.stringify(dealers));

            let users = JSON.parse(localStorage.getItem('bhai_users') || '[]');
            users.push({ username: u, password: p, balance: b, createdBy: loggedDealer.username });
            localStorage.setItem('bhai_users', JSON.stringify(users));

            document.getElementById('currentDealerBalance').innerText = `Credit Balance: Rs. ${loggedDealer.balance}`;
            renderUsers();
            alert(`User '${u}' created successfully!`);

            document.getElementById('uName').value = '';
            document.getElementById('uPass').value = '';
            document.getElementById('uBal').value = '';
        }

        function renderUsers() {
            let users = JSON.parse(localStorage.getItem('bhai_users') || '[]');
            let myUsers = users.filter(u => u.createdBy === loggedDealer.username);
            let tbody = document.getElementById('userTableBody');
            tbody.innerHTML = '';

            if(myUsers.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:#8a99ad;">No users created yet.</td></tr>`;
                return;
            }

            myUsers.forEach(u => {
                tbody.innerHTML += `
                    <tr>
                        <td><strong>${u.username}</strong></td>
                        <td>${u.password}</td>
                        <td style="color:#2ed573; font-weight:bold;">Rs. ${u.balance}</td>
                    </tr>
                `;
            });
        }
    </script>
</body>
</html>
