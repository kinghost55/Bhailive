<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Admin Panel - Bhai Live</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0f141f; color: #ffffff; padding: 20px; }
        .login-wrapper { display: flex; justify-content: center; align-items: center; height: 80vh; }
        .login-card { background: #1a2332; border: 1px solid #ffb703; border-radius: 10px; padding: 30px; width: 100%; max-width: 400px; text-align: center; }
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 0.9rem; color: #a0aec0; }
        .form-group input { width: 100%; padding: 10px; background: #243044; border: 1px solid #2a364f; color: white; border-radius: 5px; }
        .btn { background: #ffb703; color: black; border: none; padding: 10px; border-radius: 5px; font-weight: bold; cursor: pointer; width: 100%; }
        #adminDashboard { display: none; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; background: #1a2332; padding: 15px; border-radius: 8px; border-bottom: 2px solid #ffb703; margin-bottom: 20px; }
        .card { background: #1a2332; border: 1px solid #2a364f; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
        .card-title { color: #ffb703; font-size: 1.1rem; margin-bottom: 15px; border-bottom: 1px solid #2a364f; padding-bottom: 5px; }
        .grid { display: grid; grid-template-columns: 1fr 2fr; gap: 20px; }
        @media(max-width: 800px) { .grid { grid-template-columns: 1fr; } }
        .data-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        .data-table th, .data-table td { border: 1px solid #2a364f; padding: 8px; text-align: left; }
        .data-table th { background: #243044; color: #ffb703; }
    </style>
</head>
<body>

    <!-- Login Screen -->
    <div class="login-wrapper" id="loginScreen">
        <div class="login-card">
            <h2 style="color:#ffb703; margin-bottom:15px;">👑 Master Admin Login</h2>
            <div class="form-group">
                <label>Admin User</label>
                <input type="text" id="aUser" value="admin">
            </div>
            <div class="form-group">
                <label>Admin Password</label>
                <input type="password" id="aPass" value="1212">
            </div>
            <button class="btn" onclick="adminLogin()">Login</button>
        </div>
    </div>

    <!-- Admin Dashboard -->
    <div id="adminDashboard">
        <div class="admin-header">
            <div style="color:#ffb703; font-weight:bold; font-size:1.3rem;">👑 Bhai Live - Main Owner Panel</div>
            <button style="background:#ff4757; color:white; border:none; padding:6px 12px; border-radius:4px; cursor:pointer;" onclick="location.reload()">Logout</button>
        </div>

        <div class="grid">
            <div>
                <div class="card">
                    <div class="card-title">💼 Create Dealer (Sub-Admin)</div>
                    <div class="form-group">
                        <label>Dealer Username</label>
                        <input type="text" id="dName" placeholder="Enter dealer username">
                    </div>
                    <div class="form-group">
                        <label>Dealer Password</label>
                        <input type="password" id="dPass" placeholder="Enter password">
                    </div>
                    <div class="form-group">
                        <label>Assign Credit Balance</label>
                        <input type="number" id="dBal" placeholder="0.00">
                    </div>
                    <button class="btn" onclick="createDealer()">Create Dealer</button>
                </div>
            </div>

            <div>
                <div class="card">
                    <div class="card-title">📋 Active Dealers List</div>
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Dealer Username</th>
                                <th>Credit Balance</th>
                                <th>Password</th>
                            </tr>
                        </thead>
                        <tbody id="dealerTableBody">
                            <!-- Dealers loaded here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        function adminLogin() {
            let userInput = document.getElementById('aUser').value.trim();
            let passInput = document.getElementById('aPass').value.trim();

            if(userInput === 'admin' && passInput === '1212') {
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('adminDashboard').style.display = 'block';
                renderDealers();
            } else { 
                alert('Ghalat Details! Use admin / 1212'); 
            }
        }

        function createDealer() {
            let u = document.getElementById('dName').value.trim();
            let p = document.getElementById('dPass').value.trim();
            let b = parseFloat(document.getElementById('dBal').value) || 0;

            if(!u || !p) { 
                alert('Please fill all fields!'); 
                return; 
            }

            let dealers = JSON.parse(localStorage.getItem('bhai_dealers') || '[]');
            dealers.push({ username: u, password: p, balance: b });
            localStorage.setItem('bhai_dealers', JSON.stringify(dealers));

            renderDealers();
            alert(`Dealer '${u}' Created Successfully!`);

            document.getElementById('dName').value = '';
            document.getElementById('dPass').value = '';
            document.getElementById('dBal').value = '';
        }

        function renderDealers() {
            let dealers = JSON.parse(localStorage.getItem('bhai_dealers') || '[]');
            let tbody = document.getElementById('dealerTableBody');
            tbody.innerHTML = '';
            
            if(dealers.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:#8a99ad;">No dealers created yet.</td></tr>`;
                return;
            }

            dealers.forEach(d => {
                tbody.innerHTML += `
                    <tr>
                        <td><strong>${d.username}</strong></td>
                        <td style="color:#ffb703; font-weight:bold;">Rs. ${d.balance}</td>
                        <td>${d.password}</td>
                    </tr>
                `;
            });
        }
    </script>
</body>
</html>
