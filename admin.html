<!DOCTYPE html>
<DOCTYPE lang="ur" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bhai Live - Admin Panel (بھائی لائیو ایڈمن)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #e6edf3;
            padding: 20px;
        }

        header {
            background-color: #161b22;
            padding: 15px 20px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #30363d;
            margin-bottom: 20px;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: #ffb703;
        }

        .admin-badge {
            background: #da3633;
            color: white;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        /* Form for Creating User */
        .card-box {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .section-title {
            color: #ffb703;
            font-size: 1.2rem;
            margin-bottom: 15px;
            border-bottom: 1px solid #30363d;
            padding-bottom: 5px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        input {
            width: 100%;
            padding: 10px;
            background: #0d1117;
            border: 1px solid #30363d;
            color: #ffffff;
            border-radius: 6px;
        }

        .btn-main {
            background: #238636;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            grid-column: span 1;
        }

        .btn-main:hover {
            background: #2ea043;
        }

        /* Client Cards List */
        .client-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .client-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #21262d;
            padding-bottom: 10px;
            margin-bottom: 10px;
        }

        .client-name-box {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .client-name {
            font-size: 1.2rem;
            font-weight: bold;
            color: #58a6ff;
        }

        .edit-name-btn {
            background: none;
            border: none;
            color: #8b949e;
            cursor: pointer;
            font-size: 0.9rem;
        }

        /* Status Pills (Plus/Minus) */
        .status-pill {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: bold;
        }
        .status-plus { background: rgba(46, 213, 115, 0.2); color: #2ed573; }
        .status-minus { background: rgba(255, 71, 87, 0.2); color: #ff4757; }

        .client-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
            margin-bottom: 15px;
            font-size: 0.95rem;
        }

        .detail-item {
            background: #0d1117;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #21262d;
        }

        .detail-item span {
            display: block;
            color: #8b949e;
            font-size: 0.75rem;
        }

        /* Action Buttons: W, D, B */
        .action-btns {
            display: flex;
            gap: 10px;
        }

        .btn-action {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.1rem;
            text-align: center;
        }

        .btn-w { background: #ff4757; color: white; } /* Withdraw */
        .btn-d { background: #2ed573; color: black; } /* Deposit */
        .btn-b { background: #ffb703; color: black; } /* Bet History */

        /* History Log Section */
        .history-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 0.9rem;
        }

        .history-table th, .history-table td {
            border: 1px solid #30363d;
            padding: 10px;
            text-align: left;
        }

        .history-table th {
            background: #21262d;
            color: #ffb703;
        }

        .btn-danger {
            background: #da3633;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #161b22;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #ffb703;
            z-index: 2000;
            width: 90%;
            max-width: 450px;
        }
        .modal.active { display: block; }
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            z-index: 1000;
        }
        .overlay.active { display: block; }
    </style>
</head>
<body>

    <!-- Admin Header -->
    <header>
        <div class="logo">BHAI LIVE - Admin Panel</div>
        <span class="admin-badge">SYSTEM CONTROL</span>
    </header>

    <!-- Create User Account Section -->
    <div class="card-box">
        <div class="section-title">➕ Naya Client Account Banayein</div>
        <div class="form-grid">
            <input type="text" id="newUsername" placeholder="Client Name (نام)">
            <input type="text" id="newPassword" placeholder="Password (پاسورڈ)">
            <input type="number" id="initialDeposit" placeholder="Initial Balance (پہلے پیسے/کوائنز)">
            <button class="btn-main" onclick="createUser()">Create Account</button>
        </div>
    </div>

    <!-- Active Clients List -->
    <div class="card-box">
        <div class="section-title">👥 All Clients & Accounts (تمام کلائنٹس)</div>
        <div id="clientsList">
            <!-- Client Cards will appear here dynamically -->
        </div>
    </div>

    <!-- Admin Overall History Section -->
    <div class="card-box">
        <div class="section-title" style="display: flex; justify-content: space-between; align-items: center;">
            <span>📜 Admin Overall History (تمام لین دین)</span>
            <button class="btn-danger" onclick="clearAdminHistory()">Clear Admin History</button>
        </div>
        <table class="history-table">
            <thead>
                <tr>
                    <th>Date/Time</th>
                    <th>Client Name</th>
                    <th>Type</th>
                    <th>Amount</th>
                    <th>Details</th>
                </tr>
            </thead>
            <tbody id="adminHistoryBody">
                <!-- Transaction history rows -->
            </tbody>
        </table>
    </div>

    <!-- Modal for W, D, B Actions -->
    <div class="overlay" id="overlay" onclick="closeModal()"></div>
    
    <div class="modal" id="actionModal">
        <h3 id="modalTitle" style="margin-bottom: 15px; color: #ffb703;">Transaction</h3>
        <div id="modalInputs">
            <input type="number" id="modalAmount" placeholder="Enter Amount (رقم درج کریں)">
            <button class="btn-main" id="modalSubmitBtn" style="width: 100%; margin-top: 10px;">Confirm</button>
        </div>
        <div id="modalHistoryView" style="display: none; max-height: 250px; overflow-y: auto;">
            <!-- Client Specific Bet History View -->
        </div>
        <button class="btn-danger" onclick="closeModal()" style="width: 100%; margin-top: 10px;">Close</button>
    </div>

    <script>
        // Local Data Storage array (In-Memory Database Simulation)
        let clients = [
            { id: 1, name: "Ali Raza", password: "user123", balance: 5000, pnl: +1200, history: [{ type: "BET", detail: "PAK vs IND - Match Winner", amount: 1000 }] },
            { id: 2, name: "Usman Ahmed", password: "pass456", balance: 2500, pnl: -800, history: [{ type: "BET", detail: "AUS vs ENG - Session", amount: 500 }] }
        ];

        let adminHistory = [
            { date: "2026-11-06", client: "Ali Raza", type: "DEPOSIT", amount: 5000, details: "Initial Account Load" }
        ];

        let selectedClientId = null;

        // Render Clients List
        function renderClients() {
            const list = document.getElementById('clientsList');
            list.innerHTML = '';

            clients.forEach(client => {
                const isPlus = client.pnl >= 0;
                const statusClass = isPlus ? 'status-plus' : 'status-minus';
                const statusText = isPlus ? `+${client.pnl} (Winning/Plus)` : `${client.pnl} (Losing/Minus)`;

                const card = document.createElement('div');
                card.className = 'client-card';
                card.innerHTML = `
                    <div class="client-header">
                        <div class="client-name-box">
                            <span class="client-name" id="name-${client.id}">${client.name}</span>
                            <button class="edit-name-btn" onclick="renameClient(${client.id})">✏️ Edit Name</button>
                        </div>
                        <span class="status-pill ${statusClass}">${statusText}</span>
                    </div>
                    <div class="client-details">
                        <div class="detail-item"><span>Password</span><strong>${client.password}</strong></div>
                        <div class="detail-item"><span>Current Coins / Balance</span><strong style="color:#ffb703;">Rs. ${client.balance}</strong></div>
                        <div class="detail-item"><span>Total Bets Recorded</span><strong>${client.history.length}</strong></div>
                    </div>
                    <div class="action-btns">
                        <button class="btn-action btn-w" title="Withdraw Money" onclick="openActionModal(${client.id}, 'W')">W</button>
                        <button class="btn-action btn-d" title="Deposit Money" onclick="openActionModal(${client.id}, 'D')">D</button>
                        <button class="btn-action btn-b" title="Bet History" onclick="openActionModal(${client.id}, 'B')">B</button>
                    </div>
                `;
                list.appendChild(card);
            });
        }

        // Create New User Account
        function createUser() {
            const name = document.getElementById('newUsername').value.trim();
            const password = document.getElementById('newPassword').value.trim();
            const deposit = parseFloat(document.getElementById('initialDeposit').value) || 0;

            if (!name || !password) {
                alert("Meherbani karke Name aur Password dono درج کریں!");
                return;
            }

            const newClient = {
                id: Date.now(),
                name: name,
                password: password,
                balance: deposit,
                pnl: 0,
                history: deposit > 0 ? [{ type: "DEPOSIT", detail: "Initial Account Load", amount: deposit }] : []
            };

            clients.push(newClient);

            if (deposit > 0) {
                adminHistory.push({
                    date: new Date().toLocaleDateString(),
                    client: name,
                    type: "DEPOSIT",
                    amount: deposit,
                    details: "Account Creation Deposit"
                });
            }

            // Clear inputs
            document.getElementById('newUsername').value = '';
            document.getElementById('newPassword').value = '';
            document.getElementById('initialDeposit').value = '';

            renderClients();
            renderAdminHistory();
            alert("Naya Client Account Kamiyabi se Ban Gaya Hai!");
        }

        // Rename Client
        function renameClient(id) {
            const client = clients.find(c => c.id === id);
            const newName = prompt("Naya naam likhein:", client.name);
            if (newName && newName.trim() !== "") {
                client.name = newName.trim();
                renderClients();
            }
        }

        // Open W, D, B Modals
        function openActionModal(clientId, actionType) {
            selectedClientId = clientId;
            const client = clients.find(c => c.id === clientId);
            
            document.getElementById('overlay').classList.add('active');
            document.getElementById('actionModal').classList.add('active');
            
            const modalInputs = document.getElementById('modalInputs');
            const historyView = document.getElementById('modalHistoryView');
            const submitBtn = document.getElementById('modalSubmitBtn');

            if (actionType === 'W') {
                document.getElementById('modalTitle').innerText = `Withdraw Balance - ${client.name}`;
                modalInputs.style.display = 'block';
                historyView.style.display = 'none';
                submitBtn.onclick = function() { processTransaction(clientId, 'WITHDRAW'); };
            } else if (actionType === 'D') {
                document.getElementById('modalTitle').innerText = `Deposit Balance - ${client.name}`;
                modalInputs.style.display = 'block';
                historyView.style.display = 'none';
                submitBtn.onclick = function() { processTransaction(clientId, 'DEPOSIT'); };
            } else if (actionType === 'B') {
                document.getElementById('modalTitle').innerText = `Bet & Transaction History - ${client.name}`;
                modalInputs.style.display = 'none';
                historyView.style.display = 'block';
                
                let historyHtml = `
                    <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                        <span>Client History Log</span>
                        <button class="btn-danger" onclick="clearClientHistory(${client.id})">Delete Client History</button>
                    </div>
                    <table class="history-table">
                        <tr><th>Type</th><th>Detail</th><th>Amount</th></tr>
                `;

                if(client.history.length === 0) {
                    historyHtml += `<tr><td colspan="3" style="text-align:center;">Koi history nahi hai.</td></tr>`;
                } else {
                    client.history.forEach(item => {
                        historyHtml += `<tr><td>${item.type}</td><td>${item.detail}</td><td>Rs. ${item.amount}</td></tr>`;
                    });
                }
                historyHtml += `</table>`;
                historyView.innerHTML = historyHtml;
            }
        }

        // Process Deposit / Withdraw
        function processTransaction(clientId, type) {
            const amountInput = document.getElementById('modalAmount');
            const amount = parseFloat(amountInput.value);
            const client = clients.find(c => c.id === clientId);

            if (!amount || amount <= 0) {
                alert("Sahi Rakam Likhein!");
                return;
            }

            if (type === 'WITHDRAW') {
                if (client.balance < amount) {
                    alert("Account me itna balance majood nahi hai!");
                    return;
                }
                client.balance -= amount;
                client.history.push({ type: "WITHDRAW", detail: "Admin Withdraw", amount: amount });
            } else if (type === 'DEPOSIT') {
                client.balance += amount;
                client.history.push({ type: "DEPOSIT", detail: "Admin Deposit", amount: amount });
            }

            adminHistory.push({
                date: new Date().toLocaleDateString(),
                client: client.name,
                type: type,
                amount: amount,
                details: `Admin ${type}`
            });

            amountInput.value = '';
            closeModal();
            renderClients();
            renderAdminHistory();
        }

        // Delete Individual Client History (Only Admin can do this)
        function clearClientHistory(clientId) {
            const client = clients.find(c => c.id === clientId);
            if(confirm(`Kya aap ${client.name} ki tamaam bet history delete karna chahte hain?`)) {
                client.history = [];
                closeModal();
                renderClients();
                alert("Client history delete ho chuki hai!");
            }
        }

        // Delete Admin Overall History
        function clearAdminHistory() {
            if(confirm("Kya aap Admin ki tamaam overall history delete karna chahte hain?")) {
                adminHistory = [];
                renderAdminHistory();
            }
        }

        // Render Admin History Table
        function renderAdminHistory() {
            const tbody = document.getElementById('adminHistoryBody');
            tbody.innerHTML = '';

            if (adminHistory.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#8b949e;">Admin ki koi history nahi hai.</td></tr>`;
                return;
            }

            adminHistory.forEach(item => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${item.date}</td>
                    <td style="color:#58a6ff;">${item.client}</td>
                    <td><strong>${item.type}</strong></td>
                    <td style="color:#ffb703;">Rs. ${item.amount}</td>
                    <td>${item.details}</td>
                `;
                tbody.appendChild(row);
            });
        }

        function closeModal() {
            document.getElementById('overlay').classList.remove('active');
            document.getElementById('actionModal').classList.remove('active');
        }

        // Init
        window.onload = function() {
            renderClients();
            renderAdminHistory();
        };
    </script>
</body>
</html>
